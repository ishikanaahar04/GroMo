<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>GroMo Message Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f8ff;
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: white;
            max-width: 750px;
            margin: 40px auto;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 128, 0, 0.1);
            border-top: 6px solid #00a86b;
        }

        h2 {
            text-align: center;
            color: #0066cc;
            margin-bottom: 25px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #00a86b;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 168, 107, 0.3);
        }

        button {
            background-color: #00a86b;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #008c5e;
        }

        pre {
            background-color: #e6f7ff;
            padding: 15px;
            border-left: 4px solid #00a86b;
            white-space: pre-wrap;
            border-radius: 6px;
            font-size: 15px;
            color: #003366;
        }

        /* Allow the link inside the <pre> to look clickable */
        pre a {
            color: #0066cc;
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            font-size: 14px;
            color: #999;
            margin-top: 30px;
        }

        /* Responsive styles for mobile */
        @media (max-width: 480px) {
            .container {
                margin: 20px 15px;
                padding: 20px 15px;
                border-radius: 8px;
                box-shadow: 0 2px 10px rgba(0, 128, 0, 0.1);
            }

            h2 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            input, button {
                font-size: 14px;
                padding: 10px;
            }

            pre {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h2>📨 GroMo Message Generator</h2>
    <form method="POST">
        <input type="text" name="name" placeholder="Customer Name" required />
        <input type="text" name="profession" placeholder="Customer Profession" required />
        <input type="text" name="interest" placeholder="Customer Interest (optional)" />
        <input type="text" name="service" placeholder="Service to Pitch (e.g., Loan, Credit Card)" required />
        <input type="text" name="language" placeholder="Preferred Language (e.g., Hindi, English, etc.)" required />
        <input type="text" name="gp_name" placeholder="Your Name (GroMo Partner)" required />
        <button type="submit">✨ Generate Personalized Message</button>
    </form>

    {% if message %}
        <h3 style="color:#0066cc;">🎯 Output:</h3>
        <pre>{{ message | safe }}</pre>
    {% endif %}
</div>

<div class="footer">
    &copy; 2025 GroMo Message Tool
</div>
</body>
</html>
